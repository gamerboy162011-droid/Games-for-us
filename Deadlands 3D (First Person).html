T.attach=h=>{T.h=h;nr.presence({n:MP.name}).catch(()=>{});
nr.onPeers(ch=>{for(const p of ch.joined)if(p.sameTab&&!T.sid){T.sid=p.peer;h.sid(p.peer)}for(const p of ch.joined)if(!p.sameTab&&!T.known.has(p.peer)){T.known.add(p.peer);h.join(p.peer)}
for(const p of ch.joined.concat(ch.updated)){if(p.sameTab)continue;const pr=p.presence||{};if(pr.p)h.pos(pr.p,p.peer,pr.n)}for(const p of ch.left)if(T.known.delete(p.peer))h.leave(p.peer)},()=>{});
nr.on('ev',m=>{if(m.sameTab||!m.data)return;for(const e of m.data.b||[])if(!e.to||e.to==T.sid)h.ev(e,m.peer)},()=>{});nr.on('zs',m=>{if(!m.sameTab&&m.data)h.zs(m.data,m.peer)},()=>{})};
return T}
async function trysteroTransport(code){const mod=await import(TURL),room=mod.joinRoom({appId:'deadlands3d-coop'},code),[sEv,gEv]=room.makeAction('ev'),[sPos,gPos]=room.makeAction('pos'),[sZ,gZ]=room.makeAction('zs');
return{kind:'Trystero',sid:mod.selfId,sendEv:(m,to)=>sEv(m,to),sendPos:a=>sPos(a),sendZ:q=>sZ(q),leave:()=>room.leave(),attach(h){h.sid(mod.selfId);room.onPeerJoin(id=>{h.join(id);sEv({t:'hello',d:MP.name},id)});room.onPeerLeave(id=>h.leave(id));gPos((a,id)=>h.pos(a,id));gZ((q,id)=>h.zs(q,id));gEv((e,id)=>h.ev(e,id))}}}
async function mpJoin(code,name){mpLeave();MP.name=(name||'Survivor').slice(0,12);MP.code=code;MP.seed=hashStr(code);init();$('sp').onclick();mpStatus('Connecting to room '+code+'...');
let T=null,err='';try{T=await roomTransport(code)}catch(e){err=e&&e.message}
if(!T)try{T=await trysteroTransport(code)}catch(e){err=e&&e.message||err}
if(!T){mpStatus('Multiplayer unavailable here ('+(err||'no channel').slice(0,50)+')');return}
MP.room=T;MP.kind=T.kind;MP.sendEv=T.sendEv;MP.sendPos=T.sendPos;MP.sendZ=T.sendZ;MP.on=true;
T.attach({sid:id=>{MP.sid=id;elect()},
join:id=>{if(!RP[id])mkRemote(id,'Player');elect();const bl=BUILT.map(b=>({ty:b.ty,ti:b.ti,cx:b.cx,cz:b.cz,hz:b.hz}));for(let i=0;i<bl.length;i+=12)mpSend('builds',bl.slice(i,i+12),id);mpStatus('A player joined')},
leave:id=>{const r=RP[id];if(r){scene.remove(r.m);delete RP[id]}elect();mpStatus('A player left')},
pos:(a,id,nm)=>{const r=RP[id]||mkRemote(id,'Player');if(nm&&nm!==r.name){r.name=String(nm).slice(0,12);tagR(r)}r.tx=a[0];r.ty=a[1];r.tz=a[2];r.tyaw=a[3];r.pit=a[4];r.eq=a[5];r.cr=a[6];r.hp=a[7];r.nr=a[8]},
ev:(e,id)=>onEv(e,id),zs:(q,id)=>{if(!MP.host&&id==hostId())applySnap(q)}});elect();mpStatus('Connected via '+T.kind+' - room '+code)}
function mpPanel(){const code=MP.code||Math.random().toString(36).slice(2,6).toUpperCase(),nm='Survivor'+Math.floor(R0()*90+10);panel('<b>Multiplayer (co-op)</b><div><span>Name</span><input id="mn" maxlength="12" value="'+(MP.name!='Survivor'?MP.name:nm)+'" style="width:130px;padding:6px"></div><div><span>Room code</span><input id="mc" maxlength="12" value="'+code+'" style="width:130px;padding:6px"></div><div><span>Anyone who opens this page and enters the same code joins the same world (two tabs or browsers work too).</span></div><div><button data-k="go">Join</button><span></span><button data-k="x">Back</button></div>',k=>{if(k=='x'){$('pn').style.display='none';return}const c=($('mc').value.trim().toUpperCase()||code).slice(0,12);$('pn').style.display='none';mpJoin(c,$('mn').value.trim())})}
let last=performance.now();function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;upd(dt);render(dt);requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
